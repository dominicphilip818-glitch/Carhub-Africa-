<!-- NEXT UPDATE: INSPECTION BOOKING + SELLER CONTACT + TRUST FEATURES -->

<script>
/* CarHub Africa — next feature layer */

function bookInspection(carName){

const modal=document.createElement("div");

modal.className="modal open";

modal.innerHTML=`

<div class="modalBox">

<div class="modalHead">

<div>
<div class="eyebrow">CARHUB AFRICA</div>
<h2>Book inspection</h2>
</div>

<button class="close" onclick="this.closest('.modal').remove()">×</button>

</div>

<p style="color:#87948e;font-size:13px;line-height:1.6;margin-bottom:18px">
Schedule an inspection for <strong style="color:white">${carName}</strong>.
Choose a date and preferred time below.
</p>

<div class="formGrid">

<div class="formGroup">

<label>INSPECTION DATE</label>

<input
class="formInput"
type="date"
id="inspectionDate">

</div>

<div class="formGroup">

<label>PREFERRED TIME</label>

<select class="formInput" id="inspectionTime">

<option>9:00 AM</option>
<option>10:00 AM</option>
<option>11:00 AM</option>
<option>12:00 PM</option>
<option>1:00 PM</option>
<option>2:00 PM</option>
<option>3:00 PM</option>
<option>4:00 PM</option>

</select>

</div>

<div class="formGroup">

<label>YOUR NAME</label>

<input
class="formInput"
id="inspectionName"
placeholder="Full name">

</div>

<div class="formGroup">

<label>PHONE / WHATSAPP</label>

<input
class="formInput"
id="inspectionPhone"
placeholder="+234">

</div>

<div class="formGroup full">

<label>INSPECTION LOCATION</label>

<input
class="formInput"
id="inspectionLocation"
placeholder="Preferred inspection location">

</div>

</div>

<button
class="publish"
onclick="confirmInspection('${carName}')">

Confirm inspection request

</button>

</div>
`;

document.body.appendChild(modal);

}


function confirmInspection(carName){

const date=document.getElementById("inspectionDate").value;
const name=document.getElementById("inspectionName").value;
const phone=document.getElementById("inspectionPhone").value;

if(!date||!name||!phone){

alert("Please complete the required information.");

return;

}

localStorage.setItem(
"carhubInspection",
JSON.stringify({
vehicle:carName,
date:date,
time:document.getElementById("inspectionTime").value,
name:name,
phone:phone,
location:document.getElementById("inspectionLocation").value
})
);

alert(
"Inspection request received for "+carName+"."
);

document
.querySelector(".modal.open")
.remove();

}


function contactSeller(carName){

const modal=document.createElement("div");

modal.className="modal open";

modal.innerHTML=`

<div class="modalBox">

<div class="modalHead">

<div>

<div class="eyebrow">CARHUB AFRICA</div>

<h2>Contact seller</h2>

</div>

<button class="close"
onclick="this.closest('.modal').remove()">×</button>

</div>

<div style="
padding:18px;
border-radius:18px;
background:rgba(145,245,201,.055);
border:1px solid rgba(145,245,201,.10);
margin-bottom:15px;">

<div style="
font-size:10px;
color:#91f5c9;
font-weight:800;
letter-spacing:1.5px;">
VEHICLE
</div>

<div style="
font-size:18px;
font-weight:900;
margin-top:5px;">
${carName}
</div>

</div>

<div class="formGroup">

<label>MESSAGE</label>

<textarea
class="formInput"
id="sellerMessage"
placeholder="Hello, I'm interested in this vehicle..."></textarea>

</div>

<button
class="publish"
onclick="sendSellerMessage('${carName}')">

Send message

</button>

</div>
`;

document.body.appendChild(modal);

}


function sendSellerMessage(carName){

const message=document
.getElementById("sellerMessage")
.value.trim();

if(!message){

alert("Please enter a message.");

return;

}

alert(
"Message prepared for the seller about "+carName+"."
);

document
.querySelector(".modal.open")
.remove();

}


/* Replace the temporary buttons inside vehicle details */

const originalViewCar=viewCar;

viewCar=function(id){

originalViewCar(id);

setTimeout(()=>{

const buttons=document.querySelectorAll("button");

buttons.forEach(button=>{

if(button.textContent.includes("Inspection booking will be connected next")){

button.onclick=function(){

const title=document.querySelector("h1");

bookInspection(
title ? title.textContent : "Vehicle"
);

};

button.textContent="Book inspection";

}

if(button.textContent.includes("Seller contact will be connected next")){

button.onclick=function(){

const title=document.querySelector("h1");

contactSeller(
title ? title.textContent : "Vehicle"
);

};

button.textContent="Contact seller";

}

});

},50);

};


/* Close modal when tapping outside */

document.addEventListener("click",function(e){

if(e.target.classList.contains("modal")){

e.target.remove();

}

});


/* Prevent selecting dates in the past */

document.addEventListener("change",function(e){

if(e.target.id==="inspectionDate"){

const today=new Date()
.toISOString()
.split("T")[0];

e.target.min=today;

}

});
</script>
